name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

env:
  EMSDK_VERSION: '4.0.22'
  NODE_VERSION: '22'
  CF_PAGES_MAX_FILE_BYTES: '26214400'

jobs:
  # Build WASM (browser and workers)
  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check dependency build ordering and cache reuse
        run: python3 scripts/test-build-dependencies.py

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: 'emsdk-cache'

      - name: Add Emscripten upstream tools to PATH
        run: echo "$EMSDK/upstream/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          which emcc
          emcc -v
          which wasm-opt
          wasm-opt --version

      - name: Cache vcpkg installed packages
        id: cache-vcpkg
        uses: actions/cache@v6
        with:
          path: vcpkg_installed
          key: vcpkg-wasm32-v2-${{ runner.os }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('vcpkg.json', 'vcpkg_ports/**', 'deps/duckdb-spatial/vcpkg_ports/**', 'patches/duckdb-spatial/**', 'scripts/build-duckdb.sh') }}

      - name: Cache DuckDB build
        id: cache-duckdb
        uses: actions/cache@v6
        with:
          path: |
            build/emscripten
            build/emscripten-spatial
          key: duckdb-wasm-${{ runner.os }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/build-duckdb.sh', 'Makefile', 'patches/**', 'vcpkg.json', 'vcpkg_ports/**', 'deps/duckdb-spatial/vcpkg_ports/**') }}
          restore-keys: |
            duckdb-wasm-${{ runner.os }}-${{ env.EMSDK_VERSION }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Clean stale CMake cache
        run: |
          # CMake cache contains hardcoded Emscripten paths that change each run
          # Remove cache files but keep compiled objects to speed up rebuilds
          rm -rf build/emscripten/CMakeCache.txt build/emscripten/CMakeFiles
          rm -rf build/emscripten-spatial/CMakeCache.txt build/emscripten-spatial/CMakeFiles

      - name: Build browser WASM
        run: make duckdb-browser

      - name: Check browser WASM size
        run: |
          SIZE=$(stat -c%s dist/duckdb.wasm)
          LIMIT=${{ env.CF_PAGES_MAX_FILE_BYTES }}
          echo "dist/duckdb.wasm: ${SIZE} bytes"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::dist/duckdb.wasm is ${SIZE} bytes, exceeds Cloudflare Pages limit ${LIMIT}"
            exit 1
          fi

      - name: Build base workers WASM
        run: make duckdb-workers

      - name: Build Iceberg workers WASM
        run: make duckdb-workers-iceberg

      - name: Build DuckLake workers WASM
        run: make duckdb-workers-ducklake

      - name: Build Spatial workers WASM
        run: make duckdb-workers-spatial

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-artifacts
          path: |
            dist/duckdb.js
            dist/duckdb.wasm
            dist/duckdb-workers.js
            dist/duckdb-workers.wasm
            dist/duckdb-workers-iceberg.js
            dist/duckdb-workers-iceberg.wasm
            dist/duckdb-workers-ducklake.js
            dist/duckdb-workers-ducklake.wasm
            dist/duckdb-workers-spatial.js
            dist/duckdb-workers-spatial.wasm
          retention-days: 7

  # Build/test browser package
  browser:
    runs-on: ubuntu-latest
    needs: build-wasm
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-artifacts
          path: dist

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm --filter @ducklings/browser build

      - name: Type check
        run: pnpm --filter @ducklings/browser typecheck

      - name: Test
        run: pnpm --filter @ducklings/browser test

      - name: Upload browser dist
        uses: actions/upload-artifact@v7
        with:
          name: browser-dist
          path: packages/ducklings-browser/dist
          retention-days: 7

  # Build/test default and Iceberg Workers packages with separate WASM artifacts
  workers:
    runs-on: ubuntu-latest
    needs: build-wasm
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-artifacts
          path: dist

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm --filter @ducklings/workers --filter @ducklings/workers-iceberg -r build

      - name: Type check
        run: pnpm --filter @ducklings/workers --filter @ducklings/workers-iceberg -r typecheck

      - name: Test
        run: pnpm --filter @ducklings/workers --filter @ducklings/workers-iceberg -r test

      - name: Build default and Iceberg examples
        run: pnpm --filter @ducklings/example-cloudflare-worker --filter @ducklings/example-cloudflare-worker-iceberg -r build

      - name: Upload workers dist
        uses: actions/upload-artifact@v7
        with:
          name: workers-dist
          path: packages/ducklings-workers/dist
          retention-days: 7

      - name: Upload Iceberg workers dist
        uses: actions/upload-artifact@v7
        with:
          name: workers-iceberg-dist
          path: packages/ducklings-workers-iceberg/dist
          retention-days: 7

  # Build/test DuckLake workers package
  workers-ducklake:
    runs-on: ubuntu-latest
    needs: build-wasm
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-artifacts
          path: dist

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm --filter @ducklings/workers-ducklake build

      - name: Type check
        run: pnpm --filter @ducklings/workers-ducklake typecheck

      - name: Test
        run: pnpm --filter @ducklings/workers-ducklake test

      - name: Upload DuckLake workers dist
        uses: actions/upload-artifact@v7
        with:
          name: workers-ducklake-dist
          path: packages/ducklings-workers-ducklake/dist
          retention-days: 7

  # Build/test Spatial workers package
  workers-spatial:
    runs-on: ubuntu-latest
    needs: build-wasm
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-artifacts
          path: dist

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm --filter @ducklings/workers-spatial build

      - name: Type check
        run: pnpm --filter @ducklings/workers-spatial typecheck

      - name: Check Worker bundle size
        run: make check-worker-spatial-size

      - name: Integration test (workerd)
        run: pnpm --filter @ducklings/example-cloudflare-worker-spatial test

  # Lint check
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint browser package
        run: pnpm --filter @ducklings/browser lint || true

      - name: Lint default workers package
        run: pnpm --filter @ducklings/workers lint || true

      - name: Lint Iceberg workers package
        run: pnpm --filter @ducklings/workers-iceberg lint || true

      - name: Lint DuckLake workers package
        run: pnpm --filter @ducklings/workers-ducklake lint || true
